repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml           # Проверяет синтаксис YAML файлов
      - id: end-of-file-fixer    # Убеждается, что файлы заканчиваются пустой строкой
      - id: trailing-whitespace  # Удаляет лишние пробелы в конце строк
        exclude: '\.md$'
      - id: check-added-large-files # Предотвращает коммит больших файлов (например, .env или БД)
      - id: detect-private-key   # Проверяет, что не коммитятся приватные ключи

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: pip-audit -r requirements.txt
        language: system
        files: requirements.txt
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "src/", "--severity-level", "medium", "--confidence-level", "medium"]
        files: \.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--ignore=E501,W503"]
  
  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black